services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${PG_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      GATEWAY_MODE: ${GATEWAY_MODE:-test}
      GATEWAY_URL: ${GATEWAY_URL:-http://stand:3100}
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-token}
      CLOCK_MODE: ${CLOCK_MODE:-controlled}
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-true}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
  stand:
    build:
      context: .
      dockerfile: packages/stand/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - '${STAND_PORT:-3100}:3100'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      SERVICE_URL: http://api:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-token}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3100/health']
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
