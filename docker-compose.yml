services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '${PG_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d app']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
  stand:
    build:
      context: .
      dockerfile: packages/stand/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - '${STAND_PORT:-3100}:3100'
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
      SERVICE_URL: http://api:3000
      SERVICE_TOKEN: ${SERVICE_TOKEN:-dev-token}
    depends_on:
      postgres:
        condition: service_healthy
