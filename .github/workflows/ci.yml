name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test

  image:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t comment-automations-api .
      - run: docker run -d --name api -p 3000:3000 comment-automations-api
      - run: |
          for i in $(seq 1 20); do curl -sf localhost:3000/health && break; sleep 1; done
          curl -sf localhost:3000/health | grep -q "\"sha\":\"${{ github.sha }}\""
